name: Ejemplo Octokit

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  consultar:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar repositorio
        uses: actions/github-script@v8
        with:
          script: |
            const resultado = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            console.log("Repositorio:", resultado.data.name);
            console.log("URL:", resultado.data.html_url);
