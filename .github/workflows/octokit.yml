name: Ejemplo Octokit

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  consultar:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar GitHub con Octokit
        uses: actions/github-script@v9
        with:
          script: |
            const resultado = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            console.log("Repositorio:", resultado.data.name);
            console.log("Descripción:", resultado.data.description);
            console.log("Privado:", resultado.data.private);
            console.log("URL:", resultado.data.html_url);

            console.log("Issues y Pull Requests abiertos devueltos: " + issues.data.length);
